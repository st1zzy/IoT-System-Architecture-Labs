# Eclipse Mosquitto — конфигурация стенда курса (Lab 0)

# --- Listeners ---------------------------------------------------------
# MQTT поверх TCP (основной канал устройств)
listener 1883 0.0.0.0
protocol mqtt

# MQTT поверх WebSocket (для браузерных клиентов / дашбордов)
listener 9001 0.0.0.0
protocol websockets

# На Lab 0 доступ анонимный; аутентификация и ACL — Lab 4, TLS/mTLS — Lab 9
allow_anonymous true

# --- Persistence -------------------------------------------------------
# Сохраняет на диск retained-сообщения, подписки persistent-сессий
# и очереди QoS 1/2 — переживают перезапуск брокера.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# --- Logging -----------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Период публикации служебных топиков $SYS (с)
sys_interval 10

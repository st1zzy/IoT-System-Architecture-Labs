# Lab 9: «слабый» брокер для сравнения — без TLS, анонимный доступ, ACL по client_id (%c)
listener 1883 0.0.0.0
allow_anonymous true
acl_file /mosquitto/config/acl
persistence false
set_tcp_nodelay true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

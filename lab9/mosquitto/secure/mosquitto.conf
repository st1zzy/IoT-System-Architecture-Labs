# Lab 9: защищённый брокер — mTLS, идентичность из сертификата, CRL, ACL по CN
per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl

# основной слушатель: только TLS 1.3, клиент обязан предъявить сертификат цепочки ENU IoT Lab
listener 8883 0.0.0.0
tls_version tlsv1.3
cafile /pki/chain.pem
certfile /pki/certs/broker.crt
keyfile /pki/certs/broker.key
crlfile /pki/crl.pem
require_certificate true
use_identity_as_username true

# для замера стоимости TLS 1.2 (минимальная версия 1.2) — та же PKI и та же авторизация
listener 8884 0.0.0.0
tls_version tlsv1.2
cafile /pki/chain.pem
certfile /pki/certs/broker.crt
keyfile /pki/certs/broker.key
crlfile /pki/crl.pem
require_certificate true
use_identity_as_username true

persistence false
set_tcp_nodelay true
# журнал аудита: подключения с идентичностью, отказы, подписки
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

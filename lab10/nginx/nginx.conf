# L4-балансировщик MQTT: TCP-соединение целиком уходит на один узел EMQX (MQTT-сессия «липкая» сама по себе)
worker_processes 2;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;      # на каждого клиента — 2 сокета (клиент + upstream)
    multi_accept on;
}

stream {
    log_format mqtt '$remote_addr [$time_local] $upstream_addr $status $session_time';
    access_log off;
    error_log /dev/stderr warn;

    upstream emqx {
        least_conn;
        server emqx1:1883 max_fails=1 fail_timeout=10s;
        server emqx2:1883 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 1883 backlog=65535;
        proxy_pass emqx;
        proxy_connect_timeout 2s;
        proxy_timeout 10m;           # больше keepalive MQTT, иначе NGINX рвёт тихие сессии
        proxy_next_upstream on;      # узел не принял TCP — пробуем следующий
        proxy_next_upstream_tries 2;
    }
}

# Lab 5: брокер конвейера телеметрии
listener 1883 0.0.0.0
allow_anonymous true
set_tcp_nodelay true
persistence false
# окно неподтверждённых сообщений на клиента: ingest с backpressure подтверждает только после записи
max_inflight_messages 1000
# очередь брокера для медленного потребителя; сверх неё — отбрасывание ($SYS .../dropped)
max_queued_messages 20000
sys_interval 5
log_dest stdout
log_type error
log_type warning
log_type notice

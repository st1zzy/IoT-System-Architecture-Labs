# Lab 4: брокер A — производственная конфигурация

# --- Слушатель: только с аутентификацией -----------------------------------------
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
per_listener_settings false
set_tcp_nodelay true

# --- Persistence: сессии, очереди и retained переживают рестарт ------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
# persistent-сессии, не подключавшиеся сутки, удаляются (защита от «спящих» сессий)
persistent_client_expiration 1d

# --- Лимиты -----------------------------------------------------------------------
max_inflight_messages 20          # окно QoS 1/2 на клиента
max_queued_messages 100           # очередь offline-клиента; дальше сообщения отбрасываются
message_size_limit 1024           # payload > 1 КБ отклоняется (телеметрия ~100 Б)
max_keepalive 120                 # клиент не может запросить keep-alive длиннее
max_connections 1000

# --- Метрики -----------------------------------------------------------------------
sys_interval 5

# --- Журнал ------------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Мост A ⇄ B ----------------------------------------------------------------------
connection bridge-a-to-b
address mosquitto-b:1883
remote_clientid bridge-a
# телеметрия и статусы — в B, команды из B — в A; both для статусов проверяет защиту от петель
topic enu/+/+/up/# out 1
topic enu/+/+/status both 1
topic enu/+/+/down/# in 1
cleansession false
try_private true                  # флаг bridge: брокер-партнёр не вернёт сообщение обратно
notifications true                # $SYS/broker/connection/bridge-a-to-b/state
bridge_protocol_version mqttv311
restart_timeout 2 10

# Lab 2: вариант брокера с настройкой сокетов по умолчанию (алгоритм Нейгла включён) — для сравнения

listener 1883 0.0.0.0
protocol mqtt

listener 8883 0.0.0.0
protocol mqtt
certfile /certs/server.crt
keyfile /certs/server.key
# минимальная версия TLS 1.2; 1.3 тоже доступна — клиент выбирает версию для сравнения
tls_version tlsv1.2

allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Подробный лог здесь не нужен: каждый PUBLISH в log_type all нагружает брокер в замерах задержки
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

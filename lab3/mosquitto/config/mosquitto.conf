# Lab 3: брокер для экспериментов QoS / retained / LWT

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
set_tcp_nodelay true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Лимиты очередей persistent-сессий (§10.7.1: «тысячи спящих сессий → неограниченный рост очередей»)
max_queued_messages 5000
max_inflight_messages 20

# information — подключения, отключения, тайм-ауты keep-alive и публикация LWT
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
